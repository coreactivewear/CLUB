<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORE Club</title>
<meta name="theme-color" content="#FBF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CORE Club">
<meta name="description" content="CORE Club · Entrena con core. activewear: planes por objetivo, retos y progreso.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..900,100&family=Montserrat:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* Layout idea: core. brand world — cream paper, beige watercolor blobs, black ink; phone-width column, sticky logo bar, bottom nav. Single light theme by choice (brand). */
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --ink:#161412; --muted:#7A7068;
  --accent:#161412; --accent-ink:#FBF8F3; --soft:#EFE7DC; --beige:#CDBBA6; --taupe:#9C8670;
  --line:#E8E0D5; --ok:#5E7A53; --err:#B4432E;
  --fig:#161412; --fig2:#A69A8E; --prop:#E3D8CA; --stage:#F6F0E7;
  --skin:#E2B08F; --skin2:#C38E6E; --leg:#1E1B19; --leg2:#5C534C; --top:#1E1B19; --top2:#3A332E; --hair:#3B2A22; --shoe:#FFFFFF;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-label:'Montserrat','Arial',sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(420px 260px at -60px -40px,rgba(205,187,166,.55),transparent 70%),radial-gradient(380px 260px at calc(100% + 80px) 100%,rgba(205,187,166,.45),transparent 70%);background-attachment:fixed}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ic{width:16px;height:16px;vertical-align:-3px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:150px}
.app.wide{max-width:760px}
.bar{position:sticky;top:0;z-index:5;background:rgba(251,248,243,.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.lockup{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.lockup img{display:block;width:100%;height:auto}
.lockup .aw{font-family:var(--font-label);font-weight:700;letter-spacing:.32em;margin-right:-.32em;color:var(--ink)}
.lockup.bar{width:74px}.lockup.bar .aw{font-size:5.6px;margin-top:2px}
.lockup.cover{width:168px}.lockup.cover .aw{font-size:12px;margin-top:6px}
.lockup.reellogo{width:70px}.lockup.reellogo .aw{font-size:5.2px;margin-top:2px}
.lockup.splogo{width:190px;animation:spIn .9s ease both}.lockup.splogo .aw{font-size:13.5px;margin-top:7px}
.slogan-txt{font-family:var(--font-display);font-variation-settings:"SOFT" 100;font-weight:900;font-size:22px;line-height:1.02;text-align:center;margin:0;color:var(--ink)}
.slogan-txt.sm{font-size:18px}
.logo-btn{border:0;background:none;padding:4px 2px;margin:-4px -2px;border-radius:8px;cursor:pointer;display:flex}
.exlink{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--beige);text-underline-offset:3px;cursor:pointer}
.evo .exlink{font-weight:700}
.likechip{padding:0;overflow:hidden}
.likechip .exlink{padding:5px 10px;text-decoration:none;font-family:var(--font-label);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.likes .lrow .exlink{flex:1;text-decoration:none}
.sheet-ov{position:fixed;inset:0;z-index:40;background:rgba(22,20,18,.38);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px 26px;display:flex;flex-direction:column;gap:12px;animation:sheetUp .28s ease}
.rbtn.sm{width:36px;height:36px;font-size:15px}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-ov{animation:none}}
.cyrows{display:flex;flex-direction:column;gap:8px}
.cyrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--surface)}
.langs button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;font-family:var(--font-label);color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
main{padding:20px 16px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-display);font-variation-settings:"SOFT" 100;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:38px;font-weight:900;letter-spacing:-.01em}
h2{font-size:28px;font-weight:800}
h3{font-size:20px;font-weight:800}
h4{margin:0;font-family:var(--font-label);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
p{margin:0}
.eyebrow{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe)}
.eyebrow.light{color:var(--beige)}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center;justify-content:center}
.body{font-family:var(--font-body);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.soft{background:var(--soft);border-color:transparent}
.rowcard{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.qlabel{font-size:14px;font-weight:600}
.input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.input.sm{padding:9px 10px;border-radius:10px;text-align:center;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:999px;padding:14px 20px;font-weight:700;font-family:var(--font-label);font-size:14px;letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.light{background:var(--bg);color:var(--ink)}
.btn.sm{padding:9px 14px;font-size:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;padding:0;font-size:12px;color:var(--muted);text-decoration:underline}
.err{color:var(--err);font-size:14px;min-height:20px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 8px;font-size:14px;line-height:1.25;display:flex;flex-direction:column;gap:4px;text-align:left}
.opt b{font-weight:600}
.opt small{font-size:12px;color:var(--muted)}
.opts:not(.tall) .opt{text-align:center;align-items:center}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--soft);box-shadow:0 0 0 1px var(--ink) inset}
@media (max-width:400px){.opts.tall{grid-template-columns:1fr}}
.hero{display:flex;flex-direction:column;gap:8px}
.hero-brand{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:18px 0 6px}
.brandhead{display:flex;flex-direction:column;align-items:center;gap:12px}
.logo-lg{width:min(250px,64vw);height:auto}
.logo-cover{width:150px;height:auto;image-rendering:auto}
.cover-foot{display:flex;justify-content:center;padding:26px 0 8px}
.cover-foot .slogan{width:128px;opacity:.92}
.logo-sm{height:22px;width:auto}
.slogan{width:150px;height:auto}
.slogan.sm{width:120px}
.tagline{font-family:var(--font-label);font-weight:700;font-size:10.5px;letter-spacing:.14em}
.lead{max-width:34ch;color:var(--muted)}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.goal-card b{font-family:var(--font-display);font-weight:800;font-size:18px;line-height:1.1}
.goal-card small{font-size:12.5px;color:var(--muted);line-height:1.35}
.plan-card{background:var(--soft);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-label);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.chip.plain{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.chip.dark{background:var(--ink);color:var(--bg)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:99px}
.today{background:var(--ink);color:var(--bg);border:0;gap:10px}
.today .eyebrow{color:var(--beige)}
.today .muted{color:var(--bg);opacity:.7}
.today .btn{background:var(--bg);color:var(--ink)}
.today .btn.ghost{background:transparent;color:var(--bg);border-color:var(--bg)}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wk{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wk b{font-family:var(--font-display);font-size:24px;font-weight:900;line-height:1}
.wk small{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2}
.wk[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.wk .dots{display:flex;gap:3px;margin-top:3px}
.wk .dots span{width:6px;height:6px;border-radius:50%;background:var(--line)}
.wk .dots span.on{background:var(--beige)}
.session{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.session .day{flex:none;width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:22px}
.session.done .day{background:var(--ok);color:#fff}
.session.next{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.session.locked{opacity:.72}
.session .info{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.pill{font-family:var(--font-label);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);flex:none;white-space:nowrap}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.warn{border-color:var(--err);color:var(--err)}
.pill.acc{border-color:var(--ink);color:var(--ink)}
.pillcol{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:128px;background-image:radial-gradient(140px 90px at 110% 110%,rgba(205,187,166,.55),transparent 70%)}
.tile b{font-family:var(--font-display);font-size:19px;font-weight:800;line-height:1.1}
.tile small{font-size:12px;color:var(--muted);line-height:1.3}
.tile.wide{grid-column:1/-1;min-height:0}
.product{gap:10px}
.pviewer{border-radius:14px;background:var(--stage);overflow:hidden}
.pviewer canvas{width:100%;height:220px;display:block}
.price-sm{font-family:var(--font-display);font-weight:800;font-size:20px}
.swatches{display:flex;gap:4px}
.swatches i,.sw i{display:block;width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.shopstrip{background:var(--soft);border-color:transparent}
.best-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;background:var(--ink);color:var(--bg);padding:12px 14px;text-align:left}
.best-btn span{font-family:var(--font-label);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#E9D9C3}
.best-btn small{flex:1;font-size:14px}
.best-btn b{font-size:20px;line-height:1}
.chip.best{border:0;background:var(--ink);color:#E9D9C3;cursor:pointer}
.product{position:relative}
.ribbon{position:absolute;top:22px;left:22px;z-index:2;background:var(--ink);color:#E9D9C3;font-family:var(--font-label);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.gallery{display:flex;flex-direction:column;gap:8px}
.g-stage{position:relative;border-radius:14px;background:var(--stage);overflow:hidden;height:250px}
.gallery.big .g-stage{height:340px}
.g-stage canvas,.g-stage img{width:100%;height:100%;display:block;object-fit:cover}
.g-stage canvas[data-spin]{cursor:grab;touch-action:pan-y}
.g-stage canvas[data-spin]:active{cursor:grabbing}
.g-tag{position:absolute;right:12px;top:12px;background:rgba(251,248,243,.9);border-radius:999px;padding:4px 10px;font-family:var(--font-label);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.g-hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
.g-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:22px;line-height:1;color:var(--ink)}
.g-arrow.l{left:10px}.g-arrow.r{right:10px}
.g-dots{display:flex;justify-content:center;gap:6px}
.g-dots button{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:var(--line)}
.g-dots button.on{background:var(--ink);width:18px;border-radius:4px}
.price{font-family:var(--font-display);font-size:30px;font-weight:900}
.swrow{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;gap:2px;padding:4px;border-radius:999px;border:1.5px solid transparent;background:var(--surface)}
.sw.on{border-color:var(--ink)}
.splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background-image:radial-gradient(420px 300px at 0 0,rgba(205,187,166,.65),transparent 70%),radial-gradient(420px 300px at 100% 100%,rgba(205,187,166,.55),transparent 70%);transition:opacity .6s ease}
.splash.out{opacity:0;pointer-events:none}
.splash-wrap{display:flex;flex-direction:column;align-items:center;gap:22px}
.splash-txt{font-family:var(--font-display);font-variation-settings:"SOFT" 100;font-weight:800;font-size:26px;min-height:34px;text-align:center;transition:opacity .28s ease,transform .28s ease}
.splash-txt.swap{opacity:0;transform:translateY(6px)}
.splash .slogan-txt{position:absolute;left:0;right:0;bottom:52px;font-size:17px;opacity:.85;animation:spIn .9s .6s ease both}
@keyframes spIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.splash *{animation:none!important}}
.promo{background:var(--ink);color:var(--bg);border:0}
.promo .muted{color:var(--bg);opacity:.72}
.back{border:0;background:none;padding:0;font-weight:600;color:var(--muted);align-self:flex-start}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline .input{flex:1;min-width:160px}
/* exercise card */
.ex{gap:12px}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.ex-num{font-family:var(--font-display);font-weight:900;font-size:30px;line-height:1;color:var(--taupe);width:28px;flex:none}
.ex-title{display:flex;flex-direction:column;gap:2px}
.presc{font-family:var(--font-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.viewer{border-radius:16px;background:var(--stage);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.viewer canvas{width:100%;height:210px;display:block}
.vctrl{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.vctrl button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.vctrl button[data-vmode="ok"][aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:var(--surface)}
.vctrl button[data-vmode="err"][aria-pressed="true"]{border-color:var(--err);color:var(--err);background:var(--surface)}
.vctrl .vreel{margin-left:auto;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tips ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.35}
.tips li{display:flex;gap:6px}
.tips li::before{flex:none;font-weight:700}
.tips .good li::before{content:"✓";color:var(--ok)}
.tips .bad li::before{content:"✕";color:var(--err)}
@media (max-width:400px){.tips{grid-template-columns:1fr}}
.hist-line{background:var(--soft);border-radius:10px;padding:8px 10px}
.setgrid{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:6px;align-items:center}
.setgrid.nokg{grid-template-columns:44px 1fr 44px}
.setgrid .sh{font-family:var(--font-label);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.setgrid .sn{font-family:var(--font-display);font-weight:800;font-size:18px;text-align:center}
.check{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-weight:700;color:var(--line)}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ex-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
/* stats + progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:440px){.stats.four{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-display);font-size:32px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.stat b.sm{font-size:20px;padding-top:6px}
.stat small{font-size:12px;color:var(--muted);line-height:1.25}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.evos{display:flex;flex-direction:column}
.evo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.evo:last-child{border-bottom:0}
.evo div{display:flex;flex-direction:column}
.evo small{font-size:12px}
.spark{width:120px;height:34px;flex:none}
.spark .sa{fill:rgba(205,187,166,.45)} .spark .sl{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round} .spark .sd{fill:var(--ink)}
.big-num{font-family:var(--font-display);font-size:40px;font-weight:900;line-height:1}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;letter-spacing:.02em}
.mono.big{font-size:20px}
.code-hint{font-family:ui-monospace,Menlo,monospace;background:var(--soft);padding:2px 6px;border-radius:6px;font-size:14px}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--beige);padding-left:10px}
/* photos */
.compare{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--soft)}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.compare img.top{clip-path:inset(0 calc(100% - var(--cut)) 0 0)}
.compare input{position:absolute;left:8px;right:8px;bottom:10px;width:calc(100% - 16px)}
.compare .tagl,.compare .tagr{position:absolute;top:10px;background:rgba(22,20,18,.7);color:#fff;font-size:11px;font-weight:700;font-family:var(--font-label);letter-spacing:.06em;padding:4px 8px;border-radius:999px}
.compare .tagl{left:10px} .compare .tagr{right:10px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumb{display:flex;flex-direction:column;gap:2px;align-items:center}
.thumb>button:first-child{border:2px solid transparent;border-radius:10px;padding:0;overflow:hidden;width:100%;aspect-ratio:3/4;background:var(--soft)}
.thumb.sel>button:first-child{border-color:var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb small{font-size:11px;color:var(--muted)}
.filebtn{cursor:pointer}
.story{width:100%;border-radius:14px;border:1px solid var(--line)}
/* challenge */
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cday{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:13px;color:var(--muted)}
.cday.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cday.now{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.cday.miss{background:var(--soft);color:var(--taupe)}
.cday:disabled{opacity:.45;cursor:default}
/* plans */
.plan .price{font-family:var(--font-display);font-size:34px;font-weight:900;line-height:1}
.plan .price small{font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.plan.featured{background:var(--ink);color:var(--bg);border:0}
.plan.featured .price small{color:var(--beige)}
.plan.featured .btn.light{background:var(--bg);color:var(--ink)}
.plan.featured .btn.ghost{color:var(--bg);border-color:var(--bg)}
.plan.featured .btn:not(.ghost):not(.light){background:var(--bg);color:var(--ink)}
.howbox{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
/* nutrition */
.plate{width:150px;height:150px;border-radius:50%;margin:4px auto;position:relative;overflow:hidden;border:8px solid var(--soft)}
.plate div{position:absolute}
.pl-veg{left:0;top:0;width:50%;height:100%;background:#9DB08A}
.pl-pro{right:0;top:0;width:50%;height:50%;background:#C9A383}
.pl-carb{right:0;bottom:0;width:50%;height:50%;background:#E6D3A8}
.plate .pl-fat{width:24px;height:24px;border-radius:50%;background:#D9B84E;left:calc(50% - 12px);top:calc(50% - 12px);box-shadow:0 0 0 3px #fff}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.legend li{display:flex;gap:10px;align-items:flex-start}
.legend .dot{flex:none;width:14px;height:14px;border-radius:50%;margin-top:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
/* nav, rest, toast */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.nav>div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--cols,4),1fr)}
.nav button{border:0;background:none;padding:11px 4px 15px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;font-family:var(--font-label);letter-spacing:.04em;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[hidden]{display:none}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:7;width:min(448px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.rest[hidden]{display:none}
.rest .rt{font-family:var(--font-display);font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;min-width:62px}
.rest .rl{flex:1;font-size:13px;opacity:.85;display:flex;flex-direction:column;gap:5px}
.rest .rbar{height:4px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
.rest .rbar i{display:block;height:100%;background:var(--beige)}
.rest button{border:0;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:700;padding:8px 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
/* reel / routine player */
.reel{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;justify-content:center;
  background-image:radial-gradient(360px 260px at 0 0,rgba(205,187,166,.6),transparent 70%),radial-gradient(360px 260px at 100% 100%,rgba(205,187,166,.5),transparent 70%)}
.reel[hidden]{display:none}
.reel-in{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;padding:12px 16px 20px;gap:10px}
.segs{display:flex;gap:4px}
.segs span{flex:1;height:3px;border-radius:3px;background:rgba(22,20,18,.15);overflow:hidden}
.segs span.on{background:var(--ink)}
.segs span.cur i{display:block;height:100%;width:0;background:var(--ink)}
.reel-top{display:flex;justify-content:space-between;align-items:center}
.reel canvas{flex:1;min-height:0;width:100%;border-radius:20px;background:var(--stage)}
.reel-info{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.reel-info h2{font-size:26px}
.timer{font-family:var(--font-display);font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.rbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--surface);font-size:18px;font-weight:700}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.pillbtn.on{border-color:var(--ok);color:var(--ok)}
.pillbtn.on.err{border-color:var(--err);color:var(--err)}
/* Mi día */
.subtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.subtabs button{border:0;background:none;border-radius:10px;padding:9px 2px;font-size:12px;font-weight:700;font-family:var(--font-label);color:var(--muted)}
.subtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 2px;font-size:12px;line-height:1.2;font-weight:600;color:var(--muted)}
.scale button[aria-pressed="true"]{border-color:var(--ink);background:var(--soft);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:600;line-height:1}
.stepper output{font-family:var(--font-display);font-size:32px;font-weight:900;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.glasses{display:flex;flex-wrap:wrap;gap:6px}
.glass{width:26px;height:34px;border:2px solid var(--line);border-top:0;border-radius:3px 3px 8px 8px;background:var(--bg)}
.glass.on{border-color:#7FA6B8;background:linear-gradient(to top,#A9C7D4 70%,transparent 70%)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.tags button[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:var(--surface)}
.tags button.neg[aria-pressed="true"]{border-color:var(--err);color:var(--err)}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dnav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:18px}
.dnav button:disabled{opacity:.35}
.ready{display:flex;align-items:center;gap:14px}
.ready .ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:24px;font-weight:900;flex:none;background:conic-gradient(var(--rc) calc(var(--rv)*1%),var(--line) 0)}
.ready .ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.hist{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.hist .col{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.hist .bar{width:100%;max-width:22px;height:70px;background:var(--line);border-radius:6px;position:relative;overflow:hidden}
.hist .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--beige);border-radius:6px}
.cycbar{position:relative;height:14px;border-radius:7px;overflow:hidden;display:flex}
.cycbar i{height:100%}
.cycbar b{position:absolute;top:-3px;width:4px;height:20px;border-radius:2px;background:var(--ink)}
.micro{display:flex;flex-direction:column}
.micro .mrow{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.micro .mrow:last-child{border-bottom:0}
.micro .mrow.today b{text-decoration:underline;text-underline-offset:4px}
.likes .lrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.likes .lrow:last-child{border-bottom:0}
.lbtns{display:flex;gap:6px;flex:none}
.lbtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.lbtn[data-like="fav"][aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--soft)}
.lbtn[data-like="dis"][aria-pressed="true"]{border-color:var(--muted);color:var(--ink);background:var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
/* admin */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.client{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.client:last-child{border-bottom:0}
.client-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.client .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.client .acts{display:flex;flex-wrap:wrap;gap:6px}
.msgbox{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:14px;white-space:pre-wrap}
.flag{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  tech:{es:["Manos bajo los hombros y rodillas bajo la cadera.","Al inhalar, deja caer el ombligo y mira al frente.","Al exhalar, redondea la espalda vértebra a vértebra."],en:["Hands under shoulders, knees under hips.","Inhale, let your belly drop and look forward.","Exhale, round your back one vertebra at a time."],ru:["Ладони под плечами, колени под тазом.","На вдохе опустите живот и посмотрите вперёд.","На выдохе округлите спину позвонок за позвонком."]},
  err:{es:["Mover solo el cuello y no la espalda.","Ir rápido sin acompañar la respiración."],en:["Moving only your neck, not your spine.","Rushing instead of following your breath."],ru:["Двигать только шеей, а не спиной.","Торопиться, не следуя за дыханием."]}},
 child_pose:{type:"hold",n:{es:"Postura del niño",en:"Child's pose",ru:"Поза ребёнка"},
  tech:{es:["Desde cuadrupedia, lleva la cadera hacia los talones.","Brazos estirados al frente y frente hacia el suelo.","Respira hacia la espalda y suelta los hombros."],en:["From all fours, sit your hips back toward your heels.","Arms reaching forward, forehead toward the floor.","Breathe into your back and relax your shoulders."],ru:["Из положения на четвереньках отведите таз к пяткам.","Руки вытянуты вперёд, лоб к полу.","Дышите в спину и расслабьте плечи."]},
  err:{es:["Dejar la cadera alta sin sentarte hacia atrás.","Subir los hombros hacia las orejas."],en:["Keeping your hips high instead of sitting back.","Shrugging your shoulders up."],ru:["Оставлять таз высоко, не садясь назад.","Поднимать плечи к ушам."]}},
 hip_flexor:{type:"hold",side:1,n:{es:"Estiramiento de psoas en zancada",en:"Half-kneeling hip flexor stretch",ru:"Растяжка сгибателей бедра в выпаде"},
  tech:{es:["Rodilla de atrás apoyada (pon una toalla debajo).","Aprieta el glúteo de atrás y lleva la cadera un poco hacia delante.","Sube el brazo del mismo lado para estirar más."],en:["Back knee down (put a towel under it).","Squeeze the back glute and shift your hips slightly forward.","Reach the same-side arm up to deepen the stretch."],ru:["Заднее колено на полу (подложите полотенце).","Напрягите заднюю ягодицу и слегка подайте таз вперёд.","Поднимите руку той же стороны, чтобы усилить растяжку."]},
  err:{es:["Arquear la zona lumbar en lugar de estirar la cadera.","Llevar la rodilla de delante muy por delante del pie."],en:["Arching your lower back instead of stretching the hip.","Letting the front knee drift far past the foot."],ru:["Прогибаться в пояснице вместо растяжения бедра.","Выводить переднее колено далеко за стопу."]}},
 ham_stretch:{type:"hold",side:1,n:{es:"Estiramiento de isquios tumbada",en:"Lying hamstring stretch",ru:"Растяжка задней поверхности бедра лёжа"},
  tech:{es:["Tumbada boca arriba, sube una pierna estirada.","Sujeta por detrás del muslo (o usa la toalla en el pie).","La otra pierna estirada en el suelo y la espalda apoyada."],en:["Lying on your back, raise one straight leg.","Hold behind the thigh (or loop the towel around your foot).","Keep the other leg straight on the floor and your back down."],ru:["Лёжа на спине, поднимите прямую ногу.","Держитесь за бедро сзади (или используйте полотенце на стопе).","Другая нога прямая на полу, спина прижата."]},
  err:{es:["Doblar mucho la rodilla para subir más.","Despegar la cadera o la cabeza del suelo."],en:["Bending the knee a lot to go higher.","Lifting your hips or head off the floor."],ru:["Сильно сгибать колено, чтобы поднять ногу выше.","Отрывать таз или голову от пола."]}},
 cobra:{type:"core",n:{es:"Cobra suave",en:"Gentle cobra",ru:"Мягкая «кобра»"},
  tech:{es:["Boca abajo, manos al lado del pecho y codos pegados.","Despega el pecho alargando la columna, sin forzar.","Hombros lejos de las orejas y mirada al frente-abajo."],en:["Face down, hands beside your chest, elbows in.","Lift your chest by lengthening your spine, without forcing.","Shoulders away from your ears, eyes forward and down."],ru:["Лёжа на животе, ладони у груди, локти прижаты.","Поднимите грудь, вытягивая позвоночник, без усилия.","Плечи вниз от ушей, взгляд вперёд-вниз."]},
  err:{es:["Echar la cabeza atrás y forzar el cuello.","Empujar solo con los brazos hasta pinzar la lumbar."],en:["Throwing your head back and straining your neck.","Pushing only with your arms until your lower back pinches."],ru:["Запрокидывать голову и напрягать шею.","Выжимать только руками до зажима в пояснице."]}},
 hundred:{type:"hold",n:{es:"El cien (pilates)",en:"The hundred (Pilates)",ru:"«Сотня» (пилатес)"},
  tech:{es:["Cabeza y hombros despegados, mirada al ombligo.","Piernas en mesa o estiradas a 45°.","Bombea los brazos: 5 inhalaciones y 5 exhalaciones."],en:["Head and shoulders lifted, eyes on your belly button.","Legs in tabletop or extended at 45°.","Pump your arms: 5 counts in, 5 counts out."],ru:["Голова и плечи оторваны, взгляд на пупок.","Ноги в положении «стол» или вытянуты под 45°.","Качайте руками: 5 счётов вдох, 5 счётов выдох."]},
  err:{es:["Bajar tanto las piernas que se arquea la lumbar.","Tirar del cuello en lugar de usar el abdomen."],en:["Lowering your legs so far that your lower back arches.","Pulling with your neck instead of your abs."],ru:["Опускать ноги так низко, что прогибается поясница.","Тянуть шею вместо работы пресса."]}},
 roll_up:{type:"core",n:{es:"Roll up (pilates)",en:"Roll-up (Pilates)",ru:"Скручивание «ролл-ап» (пилатес)"},
  tech:{es:["Tumbada con los brazos estirados hacia atrás.","Sube despegando la columna vértebra a vértebra.","Estírate hacia los pies y baja igual de lento."],en:["Lie down with your arms reaching overhead.","Peel your spine off the floor one vertebra at a time.","Reach toward your toes and roll down just as slowly."],ru:["Лягте, руки вытянуты за голову.","Поднимайтесь, отрывая позвоночник позвонок за позвонком.","Тянитесь к стопам и так же медленно опускайтесь."]},
  err:{es:["Subir de golpe levantando las piernas.","Bajar dejándote caer sin control."],en:["Jerking up and lifting your legs.","Dropping back down without control."],ru:["Подниматься рывком, отрывая ноги.","Падать назад без контроля."]}},

  tech:{es:["Cabeza y hombros despegados del suelo.","Lleva una rodilla al pecho y estira la otra pierna.","Cambia de pierna con control, sin mover el tronco."],en:["Head and shoulders off the floor.","Pull one knee to your chest and extend the other leg.","Switch legs with control, keeping your torso still."],ru:["Голова и плечи оторваны от пола.","Подтяните одно колено к груди, другую ногу выпрямите.","Меняйте ноги подконтрольно, корпус неподвижен."]},
  err:{es:["Tirar del cuello con la cabeza.","Balancear el tronco al cambiar de pierna."],en:["Straining your neck.","Rocking your torso as you switch legs."],ru:["Напрягать шею.","Раскачивать корпус при смене ног."]}}

      if(jug){ctx.strokeStyle="rgba(95,140,160,.8)"; ctx.lineWidth=1.8*sc; ctx.beginPath(); ctx.arc(h[0]+w/2,y0+6*sc,3.6*sc,-Math.PI/2,Math.PI/2); ctx.stroke();}
    }
    else if(it.k==="plate"){const h=X(J[it.at]); const g=ctx.createRadialGradient(h[0]-3*sc,h[1]-3*sc,1,h[0],h[1],13*sc); g.addColorStop(0,"#4A433E"); g.addColorStop(1,COL.fig);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(h[0],h[1],12.5*sc,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.lineWidth=1.2*sc; ctx.beginPath(); ctx.arc(h[0],h[1],8.5*sc,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle="#BFB3A6"; ctx.beginPath(); ctx.arc(h[0],h[1],2.6*sc,0,Math.PI*2); ctx.fill();}
    else if(it.k==="band"){const a=X(J[it.a]), z=X(J[it.b]); ctx.strokeStyle="#C9967A"; ctx.lineWidth=2.6*sc; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(z[0],z[1]); ctx.stroke();
      ctx.strokeStyle="rgba(255,255,255,.3)"; ctx.lineWidth=.8*sc; ctx.stroke();}
    else if(it.k==="rope"){const a=X(J[it.a]), z=X(J[it.b]), m=[(a[0]+z[0])/2,(a[1]+z[1])/2+9*sc]; ctx.strokeStyle="#8A7B6E"; ctx.lineWidth=2.2*sc; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.quadraticCurveTo(m[0],m[1]+4*sc,z[0],z[1]); ctx.stroke();}
    else if(it.k==="cable"){const a=X(it.from), z=X(J[it.to]); line(a,z,1,"rgba(110,100,92,.6)"); ctx.fillStyle="#BFAE98"; ctx.beginPath(); ctx.arc(a[0],a[1],3.6*sc,0,Math.PI*2); ctx.fill();}
    else if(it.k==="grip"){const h=X(J[it.at]); ctx.fillStyle=COL.fig; ctx.beginPath(); ctx.arc(h[0],h[1],3.6*sc,0,Math.PI*2); ctx.fill();}
    ctx.restore();
  }
  if(front){
    drawLeg("N",leg); drawLeg("F",leg); drawTorso(); drawArm("N",skin); drawArm("F",skin); drawHead();
  } else {
    drawArm("F",skinF); drawLeg("F",legF);
    items.filter(it=>it.far).forEach(it=>drawItem(it,true));
    drawTorso(); drawHead(); drawLeg("N",leg); drawArm("N",skin);
  }
  items.filter(it=>!it.far).forEach(it=>drawItem(it,false));
  if(!v.noLabel){ctx.font="600 11px 'DM Sans', system-ui, sans-serif"; ctx.textBaseline="top"; ctx.textAlign="left";
    ctx.fillStyle=err?COL.err:COL.ok; ctx.fillText(err?t("v_err"):t("v_ok"),12,10);}
}

/* =========================================================
   REST TIMER
   ========================================================= */
let REST=null;
function startRest(secs){
  REST={end:Date.now()+secs*1000,total:secs}; updateRest();
  clearInterval(startRest.h); startRest.h=setInterval(updateRest,250);
}
function stopRest(){REST=null; clearInterval(startRest.h); document.getElementById("rest").hidden=true;}
function updateRest(){
  const el=document.getElementById("rest");
  if(!REST){el.hidden=true;return;}
  const left=Math.max(0,Math.ceil((REST.end-Date.now())/1000));
  el.hidden=false;
  document.getElementById("restTime").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  document.getElementById("restLabel").textContent=t("rest");
  document.getElementById("restSkip").textContent=t("skip");
  document.getElementById("restBar").style.width=(100*(1-left/REST.total))+"%";
  if(left<=0){stopRest(); toast(t("rest_over")); try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
}

function spark(vals){
  if(vals.length<2) return "";
  const W=120,H=34,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*(W-6)+3,H-4-(v-mn)/r*(H-10)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d} L${W-3} ${H} L3 ${H}Z" class="sa"/><path d="${d}" class="sl"/><circle cx="${l[0]}" cy="${l[1]}" r="3" class="sd"/></svg>`;
}

const REEL={open:false,v:null,list:[],idx:0,seq:null,si:0,t0:0,paused:false,left:0,timer:null,mode:"ok",done:false,title:""};
function openReel(list,idx){
  Object.assign(REEL,{open:true,list,idx,seq:null,done:false,mode:"ok",title:""}); buildReel();
}
function openRoutine(id){
  const r=[...ABS,...MOB].find(x=>x.id===id); if(!r) return;
  const seq=[{id:r.ex[0],kind:"ready",dur:5}];
  for(let k=1;k<=r.rounds;k++) r.ex.forEach((e,j)=>{seq.push({id:e,kind:"work",dur:r.work,round:k}); if(!(k===r.rounds&&j===r.ex.length-1)) seq.push({id:r.ex[(j+1)%r.ex.length],kind:"rest",dur:r.rest,round:k});});
  Object.assign(REEL,{open:true,list:r.ex,idx:0,seq,si:0,t0:performance.now(),paused:false,left:seq[0].dur,done:false,mode:"ok",title:t("abs_r")[id]||t("mob_r")[id],rounds:r.rounds});
  buildReel(); clearInterval(REEL.timer); REEL.timer=setInterval(tickRoutine,200);
}
function closeReel(){REEL.open=false; clearInterval(REEL.timer); document.getElementById("reel").hidden=true; document.body.classList.remove("noscroll");}
function curReelId(){return REEL.seq?REEL.seq[REEL.si].id:REEL.list[REEL.idx];}

  const el=document.getElementById("reel"), id=curReelId(), e=EX[id];
  const segs=REEL.seq?REEL.seq.filter(s=>s.kind==="work").length:REEL.list.length;
  const curSeg=REEL.seq?REEL.seq.slice(0,REEL.si+1).filter(s=>s.kind==="work").length-(REEL.seq[REEL.si].kind==="work"?1:0):REEL.idx;
  const step=REEL.seq?REEL.seq[REEL.si]:null;
  el.innerHTML=`<div class="reel-in">
    <div class="segs">${Array.from({length:segs},(_,i)=>`<span class="${i<curSeg?"on":i===curSeg?"cur":""}"><i id="${i===curSeg?"segFill":""}"></i></span>`).join("")}</div>
    <div class="reel-top">${logoBlock("reellogo")}<button type="button" class="rbtn" data-act="reelClose" aria-label="${t("close")}">✕</button></div>
    <canvas id="reelCanvas" role="img" aria-label="${esc(exName(id))}"></canvas>
    <div class="reel-info">
      ${REEL.done?`<h2>${t("finished_abs")}</h2>${sloganHTML("sm")}`:`
      ${step?`<span class="eyebrow">${step.kind==="work"?fmt(t("round_n"),{a:step.round,b:REEL.rounds}):step.kind==="rest"?t("restW"):t("get_ready")}</span>`:""}
      <h2>${step&&step.kind!=="work"?fmt(t("up_next"),{e:esc(exName(id))}):esc(exName(id))}</h2>
      ${step?`<p class="timer" id="reelTimer">${Math.ceil(REEL.left)}</p>`:`<p class="small">${e.tech[S.lang][0]}</p>`}
      <div class="inline center">

  readColors(); drawViewer(REEL.v,performance.now());

}
function tickRoutine(){
  if(!REEL.open||!REEL.seq||REEL.done) return;
  const now=performance.now(); if(!REEL.paused){REEL.left-=(now-(REEL.lastTick||now))/1000;} REEL.lastTick=now;
  const st=REEL.seq[REEL.si];
  const tm=document.getElementById("reelTimer"); if(tm) tm.textContent=Math.max(0,Math.ceil(REEL.left));
  const sf=document.getElementById("segFill"); if(sf&&st.kind==="work") sf.style.width=(100*(1-REEL.left/st.dur))+"%";
  if(REEL.left<=0){
    if(REEL.si>=REEL.seq.length-1){REEL.done=true; try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){} buildReel(); return;}
    REEL.si++; REEL.left=REEL.seq[REEL.si].dur; try{navigator.vibrate&&navigator.vibrate(120);}catch(e){} buildReel();
  }
}

/* ---- 360° ghost-mannequin turntable (until real photos arrive) ---- */
let SPINS=[], spinRaf=false;
function initSpins(){
  SPINS=[...document.querySelectorAll("canvas[data-spin]")].map(c=>{
    const s={c,pid:c.dataset.spin,th:-0.5,drag:null,last:performance.now(),vel:0};
    c.addEventListener("pointerdown",e=>{s.drag=e.clientX; s.vel=0; c.setPointerCapture(e.pointerId);});
    c.addEventListener("pointermove",e=>{if(s.drag==null) return; const dx=e.clientX-s.drag; s.drag=e.clientX; s.th+=dx*0.012; s.vel=dx*0.012;});
    const up=()=>{s.drag=null;}; c.addEventListener("pointerup",up); c.addEventListener("pointercancel",up);
    return s;});
  if(SPINS.length&&!spinRaf){spinRaf=true; requestAnimationFrame(spinLoop);}
}
function spinLoop(now){
  SPINS=SPINS.filter(s=>document.body.contains(s.c));
  if(!SPINS.length){spinRaf=false; return;}
  SPINS.forEach(s=>{const dt=Math.min(.05,(now-s.last)/1000); s.last=now;
    if(s.drag==null){ if(Math.abs(s.vel)>.002){s.th+=s.vel; s.vel*=.92;} else if(!RM) s.th+=dt*0.55; }
    drawGarment(s.c,s.th,productById(s.pid));});
  requestAnimationFrame(spinLoop);
}
function drawGarment(c,th,p){
  const dpr=Math.min(2,window.devicePixelRatio||1), W=c.clientWidth, H=c.clientHeight; if(!W||!H) return;
  if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){c.width=Math.round(W*dpr); c.height=Math.round(H*dpr);}
  const x=c.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  const B=Math.min(W*0.9,H*0.62), cx=W/2, y0=H*0.06, Y=f=>y0+f*H*0.86;
  const co=Math.cos(th), si=Math.sin(th), front=co>0;
  const O=outfit(p.id);
  // display stand
  const sg=x.createRadialGradient(cx,Y(1.02),2,cx,Y(1.02),B*.55); sg.addColorStop(0,"rgba(60,45,35,.18)"); sg.addColorStop(1,"rgba(60,45,35,0)");
  x.save(); x.translate(cx,Y(1.02)); x.scale(1,.16); x.fillStyle=sg; x.beginPath(); x.arc(0,0,B*.55,0,Math.PI*2); x.fill(); x.restore();
  x.fillStyle="#E7DCCD"; x.beginPath(); x.ellipse(cx,Y(1.0),B*.36,B*.05,0,0,Math.PI*2); x.fill();
  x.fillStyle="#D6C7B5"; x.fillRect(cx-B*.36,Y(1.0),B*.72,B*.03); x.beginPath(); x.ellipse(cx,Y(1.0)+B*.03,B*.36,B*.05,0,0,Math.PI); x.fill();
  x.fillStyle="#BFAE98"; x.fillRect(cx-B*.008,Y(.955),B*.016,Y(1.0)-Y(.955));
  // projected half-width of an elliptical cross-section (a = lateral, b = depth) and depth shift
  const hw=(a,b)=>Math.sqrt((a*co)**2+(b*si)**2);
  const shade=(col,xl,xr,y0,y1)=>{const g=x.createLinearGradient(xl,0,xr,0); const L=front?.18:.05, R=front?-.16:-.22;
    g.addColorStop(0,tint(col,L+si*.06)); g.addColorStop(.5,col); g.addColorStop(1,tint(col,R-si*.06)); return g;};
  // body section profile: [y, lateral a, depth front, depth back]
  const prof=(rows)=>rows.map(([f,a,df,db])=>{const b=(df+db)/2, sh=(db-df)/2*si*B; return {y:Y(f),w:hw(a*B,b*B),c:cx-sh};});
  const shapePath=(P)=>{x.beginPath(); P.forEach((r,i)=>{i?x.lineTo(r.c+r.w,r.y):x.moveTo(r.c+r.w,r.y);});
    for(let i=P.length-1;i>=0;i--) x.lineTo(P[i].c-P[i].w,P[i].y); x.closePath();};
  const smoothShape=(P)=>{const pts=[...P.map(r=>[r.c+r.w,r.y]),...P.slice().reverse().map(r=>[r.c-r.w,r.y])]; smoothClosed(x,pts);};
  // ---- leggings: one gradient for every piece so they read as one garment ----
  const legShade=c0=>shade(c0,cx-B*.17,cx+B*.17);
  const hips=prof([[.43,.116,.084,.088],[.47,.124,.088,.098],[.53,.136,.092,.118],[.585,.132,.088,.112],[.6,.118,.08,.1],[.615,.07,.05,.06]]);
  smoothShape(hips); x.fillStyle=legShade(O.leg); x.fill();
  const legRows=[[0,.07,.07,.078],[.17,.061,.062,.07],[.33,.04,.045,.05],[.5,.046,.05,.058],[.72,.027,.03,.032]];
  const legY0=.575, legLen=.38;
  const legs=[-1,1].map(sd=>{const X=sd*.066*B; return {sd,off:X*co,z:-X*si};}).sort((a,b)=>a.z-b.z);
  legs.forEach(L=>{
    const P=legRows.map(([f,a,df,db])=>{const bb=(df+db)/2, sh=(db-df)/2*si*B; return {y:Y(legY0+f*legLen/.72),w:hw(a*B,bb*B),c:cx+L.off-sh};});
    smoothShape(P); x.fillStyle=legShade(L.z<0&&Math.abs(si)>.3?tint(O.leg,O.light?-.07:-.05):O.leg); x.fill();
    // inner-leg crease
    x.strokeStyle=tint(O.leg,O.light?-.2:-.25); x.globalAlpha=.25; x.lineWidth=1; x.beginPath(); x.moveTo(P[0].c-L.sd*P[0].w*.55,P[0].y+4); x.lineTo(P[2].c-L.sd*P[2].w*.4,P[2].y); x.stroke(); x.globalAlpha=1;
  });
  // waistband
  const wb=prof([[.43,.116,.084,.088],[.466,.123,.088,.096]]);
  smoothShape(wb); x.fillStyle=legShade(tint(O.leg,O.light?-.05:.07)); x.fill();
  // center seam (front when facing, back otherwise)
  x.strokeStyle=tint(O.leg,O.light?-.2:.18); x.lineWidth=1; x.globalAlpha=.5; x.beginPath();
  const sx=f=>cx+(front?1:-1)*f*B*si;
  x.moveTo(sx(front?.088:.098),Y(.466)); x.quadraticCurveTo(sx(front?.092:.118),Y(.53),sx(front?.05:.06),Y(.6)); x.stroke(); x.globalAlpha=1;
  // logo on waistband
  if(co>.2){x.save(); x.translate(cx+.086*B*si,Y(.448)); x.scale(Math.max(.15,co),1); x.fillStyle=O.light?"rgba(30,27,25,.75)":"rgba(251,248,243,.85)";
    x.font=`800 ${B*.048}px Fraunces, Georgia, serif`; x.textAlign="center"; x.textBaseline="middle"; x.fillText("core.",0,0); x.restore();}
  // ---- straps: loops over invisible shoulders (back half first) ----
  const proj=(X,Z,f)=>[cx+X*B*co+Z*B*si, Y(f), -X*si+Z*co];
  const strap=(sd)=>[proj(sd*.07,.07,.215),proj(sd*.088,0,.128),proj(sd*.03,-.075,.205)];
  const drawStrap=(pts,back)=>{x.strokeStyle=back?tint(O.top,O.light?-.18:-.3):O.top; x.lineWidth=B*.024; x.lineCap="round"; x.beginPath();
    x.moveTo(pts[0][0],pts[0][1]); x.quadraticCurveTo(pts[1][0]*2-(pts[0][0]+pts[2][0])/2,pts[1][1]*2-(pts[0][1]+pts[2][1])/2,pts[2][0],pts[2][1]); x.stroke();};
  [-1,1].forEach(sd=>drawStrap(strap(sd),true));
  // ---- crop top ----
  const top=prof([[.2,.1,.072,.078],[.235,.128,.098,.084],[.28,.141,.114,.086],[.32,.133,.094,.082],[.36,.124,.084,.08]]);
  smoothShape(top); x.fillStyle=shade(O.top,cx-B*.15,cx+B*.15); x.fill();
  const ub=prof([[.334,.13,.09,.082],[.36,.124,.084,.08]]); smoothShape(ub); x.fillStyle=tint(O.top,O.light?-.07:.09); x.fill();
  if(front){ x.fillStyle=tint(O.top,O.light?-.22:-.35); x.beginPath(); x.ellipse(cx+.07*B*si,Y(.204),Math.max(2,.06*B*Math.abs(co)),B*.018,0,0,Math.PI); x.fill(); }
  else { x.fillStyle=tint(O.top,O.light?-.12:-.28); x.beginPath(); x.moveTo(cx-.075*B*si-.045*B*co,Y(.2)); x.quadraticCurveTo(cx-.085*B*si,Y(.25),cx-.075*B*si+.045*B*co,Y(.2)); x.closePath(); x.fill(); }
  // front straps over the top edge
  [-1,1].forEach(sd=>{const pts=strap(sd); if(front) drawStrap(pts,false);});
  // soft highlight sweep
  const hl=x.createLinearGradient(cx-B*.2,0,cx+B*.2,0); const k=(Math.sin(th)+1)/2;
  hl.addColorStop(Math.max(0,k-.15),"rgba(255,255,255,0)"); hl.addColorStop(k,"rgba(255,255,255,.10)"); hl.addColorStop(Math.min(1,k+.15),"rgba(255,255,255,0)");
  x.fillStyle=hl; smoothShape(top); x.fill(); smoothShape(hips); x.fill();
}

function subscribeAdmin(){

  try{
    DB.collection("clientas").onSnapshot(snap=>{

      ADM.docs=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.creado||"").localeCompare(a.creado||""));
      ADM.ready=true; renderAdminData();
    },e=>{clearTimeout(timer); ADM.err="Error al leer las clientas ("+e.code+")."; ADM.ready=true; renderAdminData();});

}

    origen:g("aOrigen"),pago:g("aPago"),codigo,codigoClub:"",clubHasta:"",premium:false,codigoReto:"",creado:new Date().toISOString()};

async function makeBackup(){
  let photos=[];
  try{ if(!PH.db) await phOpen(); photos=await phTx("readonly",st=>st.getAll())||[]; }catch(e){}
  const data={app:"core-club",v:1,at:new Date().toISOString(),state:Object.assign({},S,{view:"home",session:null}),photos};
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const name=`core-club-${(S.name||"backup").toLowerCase().replace(/[^a-z0-9а-яё]+/gi,"-")}-${dkey(new Date())}.json`;
  let ok=false;
  try{
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"CORE Club"}); ok=true;}
  }catch(e){ if(e&&e.name==="AbortError") return; }
  if(!ok){
    try{const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); ok=true;}catch(e){}
  }
  if(ok){S.lastBackup=dkey(new Date()); save(); render(); toast(t("bk_done"));}
}
async function restoreBackup(file){
  try{
    const data=JSON.parse(await file.text());
    if(!data||data.app!=="core-club"||!data.state) throw new Error("bad");
    S=Object.assign(fresh(),data.state); S.lastBackup=dkey(new Date()); save();
    if(Array.isArray(data.photos)&&data.photos.length){
      try{ if(!PH.db) await phOpen(); await phTx("readwrite",st=>{data.photos.forEach(p=>st.put(p)); return null;}); PH.ready=false; PH.loading=false; }catch(e){}
    }
    GATE="welcome"; go("home"); toast(t("bk_ok"));
  }catch(e){ toast(t("bk_bad")); }
}

function go(view){S.view=view; resetArmed=false; PLAN_PICK=""; save(); render(); window.scrollTo(0,0);}
function applyCode(p){
  if(!p) return false;
  if(p.type==="prize") return false;
  if(p.type==="start"){S.unlocked=true; S.code=p.code;}
  if(p.type==="club"){S.unlocked=true; if(p.until>S.clubUntil){S.clubUntil=p.until; S.clubCode=p.code;}}
  if(p.type==="prem"){S.unlocked=true; if(p.until>S.premUntil){S.premUntil=p.until; S.premCode=p.code;} if(p.until>S.clubUntil) S.clubUntil=p.until;}
  if(p.type==="reto"){S.retoCode=p.code;}
  if(p.type==="plan"){S.goal=p.goal; S.level=p.level; S.place=p.place; S.block=p.block; S.week=1; toast(t("coach_ok"));}
  save(); return true;
}
function finishSession(){
  const {b,w,d}=S.session, k=sk(b,w,d); S.done[k]=true; stopRest();
  const today=dkey(new Date());
  if(d!=="T") dayList(d,b).map(resolveEx).forEach(id=>{
    const rows=((S.sl[k]||{})[id]||[]).filter(r=>r&&(r.ok||r.r||r.kg));
    if(!rows.length) return;
    const kg=Math.max(0,...rows.map(r=>parseFloat(r.kg)||0)), reps=Math.max(0,...rows.map(r=>parseInt(r.r,10)||0));
    if(!kg&&!reps) return;
    const h=S.hist[id]=S.hist[id]||[]; const e={d:today,kg,reps};
    if(h.length&&h[h.length-1].d===today) h[h.length-1]=e; else h.push(e);
    while(h.length>60) h.shift();
  });
  if(b===S.block&&doneCount(b)>=12){S.block=b+1; S.week=1; save(); go("home"); toast(fmt(t("block_done"),{n:b,m:b+1})); return;}
  const nx=nextSession(); if(nx) S.week=nx.w;
  go("home"); toast(t("toast_done"));
}
function checkPrize(){
  const ch=S.ch; if(!ch||ch.prize) return;
  if(challengeDay()>=30&&ch.t30&&challengeDone()>=26){ch.prize=makePrize(rand4()); save(); render();}
}

    if(ADM.busy) return;
    const g=id=>document.getElementById(id).value.trim(), errEl=document.getElementById("admErr");
    if(!g("aNombre")||!g("aContacto")){errEl.textContent="Falta el nombre o el contacto."; return;}
    if(!DB){errEl.textContent="La base de datos no está disponible en esta vista."; return;}
    const doc=buildClientDoc(g);
    ADM.busy=true; const btn=document.getElementById("admSubmit"); btn.disabled=true; errEl.textContent="";
    try{
      await DB.doc("clientas/"+doc.codigo).set(doc);
      ADM.last=Object.assign({id:doc.codigo},doc);
      ["aNombre","aContacto","aSet","aNotas","aOrigen"].forEach(id=>document.getElementById(id).value="");
      renderAdminData(); document.getElementById("admLast").scrollIntoView({behavior:RM?"auto":"smooth",block:"center"});
    }catch(err){
      errEl.textContent=err&&err.code==="quota_exceeded"?"La base de datos está llena: elimina clientas antiguas.":"No se pudo guardar ("+(err&&err.code||"error")+"). Inténtalo de nuevo.";
    }finally{ADM.busy=false; btn.disabled=false;}
  }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="obName") S.name=el.value;
  if(el.id==="obContact") S.contact=el.value;
  if(el.id==="admQ"){ADM.q=el.value; renderAdminData();}
  if(el.id==="nuW"){S.nuW=el.value; save();}
  if(el.id==="cmpRange"){el.parentElement.style.setProperty("--cut",el.value+"%");}
  if(el.dataset.cinote){setLog("note",el.value);}
  if(el.dataset.sl){
    const {b,w,d}=S.session, k=sk(b,w,d), id=el.dataset.sl, i=+el.dataset.i;
    S.sl[k]=S.sl[k]||{}; S.sl[k][id]=S.sl[k][id]||[]; const r=S.sl[k][id][i]=S.sl[k][id][i]||{}; r[el.dataset.f]=el.value; save();
  }
  if(el.dataset.test){const b=S.session.b; S.test[b]=S.test[b]&&typeof S.test[b]==="object"?S.test[b]:{}; S.test[b][el.dataset.test]=el.value; save();}
  if(el.dataset.chtest){S.ch[el.dataset.chtest]=el.value; save();}
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.id==="nuW") render();
  if(el.dataset.chtest) checkPrize();
  if(el.dataset.micro!=null&&el.dataset.micro!==""){S.micro[+el.dataset.micro]=el.value; save(); render();}
  if(el.dataset.cy){
    const f=el.dataset.cy;
    if(f==="last"){if(el.value&&el.value<=dkey(new Date())){S.cycle.last=el.value; if(!S.cycle.hist.includes(el.value)) S.cycle.hist.push(el.value);} }
    else {const n=parseInt(el.value,10); const [lo,hi]=f==="len"?[18,45]:[2,10]; if(!isNaN(n)) S.cycle[f]=Math.max(lo,Math.min(hi,n));}
    S.cycle.hist=S.cycle.hist.sort().slice(-24); save(); render();
  }
  if(el.id==="phFile"&&el.files&&el.files[0]){
    try{
      if(!PH.db) await phOpen();
      const src=await shrink(el.files[0]); const p={id:String(Date.now()),d:dkey(new Date()),src};
      await phTx("readwrite",st=>st.put(p)); PH.list.push(p); PH.list.sort((a,b)=>a.d.localeCompare(b.d)); PH.err=false;
    }catch(err){toast(t("ph_err"));}
    render();
  }
});
window.addEventListener("resize",()=>VIEWERS.forEach(v=>{v.dirty=true; if(!v.playing) drawViewer(v,performance.now());}));
document.addEventListener("keydown",e=>{if(REEL.open&&e.key==="Escape") closeReel();});

/* =========================================================
   BOOT
   ========================================================= */
function readHash(){
  const h=decodeURIComponent((location.hash||"").slice(1)); if(!h) return;
  const p=parseCode(h); if(!p||p.type==="prize") return;
  if(S.level===null){ if(p.type!=="plan"){applyCode(p); S.code=p.code; GATE="ob";} }
  else if(applyCode(p)&&p.type!=="plan") toast(t("code_ok"));
}
readHash();
if(S.level!==null&&S.view==="home"){const nx=nextSession(); if(nx) S.week=nx.w;}
if(S.view==="session"&&!S.session) S.view="home";
render();
if(S.view!=="admin") showSplash();
window.addEventListener("hashchange",()=>{readHash(); render();});

(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  try{const u=await window.claude.use("user"); OWNER=u?!!(await Promise.resolve(u.isOwner())):false;}catch(e){OWNER=false;}
  if(OWNER){
    try{DB=await window.claude.use("db");}catch(e){DB=null;}
    if(DB) subscribeAdmin(); else {ADM.err="La base de datos no está disponible en esta vista."; ADM.ready=true;}
    render();
  }
})();

document.getElementById("barLogo").innerHTML=logoBlock("bar"); document.getElementById("barLogo").setAttribute("aria-label",t("home_lbl"));
</script>
